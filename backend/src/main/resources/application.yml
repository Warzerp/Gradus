server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    protocol: TLS
    enabled-protocols: TLSv1.3

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buscador_semantico}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  cifrado:
    clave-base64: ${AES_KEY_BASE64:}

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-ada-002
  embedding-url: https://api.openai.com/v1/embeddings
