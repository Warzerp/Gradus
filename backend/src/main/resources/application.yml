server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buscador_semantico}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway maneja el esquema; JPA solo valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: filesystem:../db/migrations
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}         # Mínimo 256 bits; cargado desde variable de entorno
    expiration-ms: 3600000        # 1 hora
    refresh-expiration-ms: 86400000  # 24 horas
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}